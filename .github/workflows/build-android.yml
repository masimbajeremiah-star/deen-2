name: Build DAWALINK Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Type-check mobile app
        run: npm run typecheck
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Diagnose Expo Android autolinking metadata
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/expo-autolinking.json
          node -e 'const x=require("/tmp/expo-autolinking.json"); for (const [i,m] of (x.modules||[]).entries()) for (const p of (m.projects||[])) if (p.publication && !p.publication.version) console.log("MISSING_PUBLICATION_VERSION",i,m.packageName||m.name,p.name,JSON.stringify(p.publication));'
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAWALINK-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
