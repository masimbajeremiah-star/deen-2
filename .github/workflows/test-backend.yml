name: DAWALINK backend tests
on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'lib/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-backend.yml'
  pull_request:
    paths:
      - 'server.js'
      - 'lib/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-backend.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
